[package]
name = "git-task"
version = "0.2.4"
authors = ["jhspetersson <jhspetersson@gmail.com>"]
description = "Local-first task manager/bug tracker within your git repository which can sync issues with remote sources."
keywords = ["git", "task", "manager", "bug", "tracker"]
categories = ["command-line-utilities", "command-line-interface"]
documentation = "https://github.com/jhspetersson/git-task/blob/master/README.md"
homepage = "https://github.com/jhspetersson/git-task"
repository = "https://github.com/jhspetersson/git-task"
readme = "README.md"
license = "GPL-3.0-or-later"
edition = "2024"

[lib]
name = "gittask"
path = "src/lib.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
enable-ansi-support = "0.3.1"
evalexpr = "11"
futures-util = "0.3.34"
git2 = { version = "0.21", default-features = false }
gitlab = "0.1904.0"
graphql_client = "0.16"
jira_v3_openapi = {  version = "1.6", features = ["all"] }
nu-ansi-term = "0.50.3"
octocrab = { version = "0.54.2", features = ["stream"] }
regex = "1.13"
reqwest = { version = "0.13", features = ["blocking", "json"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
redmine-api = "0.11.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tempfile = "3.27"
tokio = { version = "1.53", features = ["rt-multi-thread"] }
