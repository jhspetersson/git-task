name: build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'windows-latest', 'macos-latest']
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Set up git
      run: git config user.name Tester && git config user.email tester@example.com
    - name: Run tests
      run: cargo test --verbose -- --test-threads 1

  redmine-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redmine:
        image: redmine:6
        ports:
          - 3000:3000
    steps:
    - uses: actions/checkout@v4
    - name: Wait for Redmine
      run: curl --silent --output /dev/null --retry 60 --retry-delay 5 --retry-all-errors http://localhost:3000/
    - name: Prepare Redmine (default data, REST API, admin key)
      run: |
        docker exec -e REDMINE_LANG=en ${{ job.services.redmine.id }} rake redmine:load_default_data
        KEY=$(docker exec ${{ job.services.redmine.id }} rails runner 'Setting.rest_api_enabled = "1"; u = User.find_by_login("admin"); u.must_change_passwd = false; u.save!; print u.api_key' 2>/dev/null | tail -n 1)
        test -n "$KEY"
        echo "::add-mask::$KEY"
        echo "GIT_TASK_REDMINE_URL=http://localhost:3000" >> "$GITHUB_ENV"
        echo "GIT_TASK_REDMINE_API_KEY=$KEY" >> "$GITHUB_ENV"
    - name: Set up git
      run: git config --global user.name Tester && git config --global user.email tester@example.com
    - name: Run Redmine integration tests
      run: cargo test --verbose --test redmine

  gitlab-integration:
    # GitLab CE takes several minutes to boot, so this job stays off the pull request path.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      gitlab:
        image: gitlab/gitlab-ce:latest
        ports:
          - 8080:80
        env:
          GITLAB_ROOT_PASSWORD: GitTaskCiPassw0rd!
          GITLAB_OMNIBUS_CONFIG: "external_url 'http://localhost'; puma['worker_processes'] = 0; sidekiq['concurrency'] = 5; prometheus_monitoring['enable'] = false"
        options: --shm-size 256m
    steps:
    - uses: actions/checkout@v4
    - name: Wait for GitLab
      run: curl --silent --fail --output /dev/null --retry 120 --retry-delay 10 --retry-all-errors http://localhost:8080/users/sign_in
    - name: Create an API token
      run: |
        TOKEN=$(docker exec ${{ job.services.gitlab.id }} gitlab-rails runner 'u = User.find_by_username("root"); t = u.personal_access_tokens.create(scopes: ["api"], name: "git-task-ci", expires_at: 7.days.from_now); t.set_token("glpat-" + SecureRandom.alphanumeric(20)); t.save!; print t.token' 2>/dev/null | tail -n 1)
        test -n "$TOKEN"
        echo "::add-mask::$TOKEN"
        echo "GIT_TASK_GITLAB_URL=http://localhost:8080" >> "$GITHUB_ENV"
        echo "GIT_TASK_GITLAB_TOKEN=$TOKEN" >> "$GITHUB_ENV"
    - name: Set up git
      run: git config --global user.name Tester && git config --global user.email tester@example.com
    - name: Run GitLab integration tests
      run: cargo test --verbose --test gitlab

  github-integration:
    # Runs against the real github.com repository jhspetersson/git-task-ci, so it needs the
    # GIT_TASK_GITHUB_TOKEN secret, which pull requests from forks do not get.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The test repository is shared between runs, so they must not overlap.
    concurrency:
      group: github-integration
      cancel-in-progress: false
    env:
      GIT_TASK_GITHUB_TOKEN: ${{ secrets.GIT_TASK_GITHUB_TOKEN }}
      GIT_TASK_GITHUB_REPO: jhspetersson/git-task-ci
    steps:
    - uses: actions/checkout@v4
    - name: Set up git
      run: git config --global user.name Tester && git config --global user.email tester@example.com
    - name: Run GitHub integration tests
      run: cargo test --verbose --test github -- --test-threads 1
